[package]
name = "loka-postgres"
version = "0.1.0"
edition = "2021"

[dependencies]
loka-core = { path = "../loka-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
dashmap = "6"
tracing = "0.1"
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
